<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A Trusted Reputation Built Over Time</title>
  <link rel="stylesheet" href="zad 1.css">
</head>
<body>
  <main class="page">
    <header class="intro">
      <h1>A Trusted Reputation Built Over Time</h1>
      <p>Building quality, trust, and lasting relationships with every project.</p>
    </header>

    <section class="mosaic" aria-label="Construction company highlights">
      <figure class="tile team-photo">
        <img src="images zad1/project-planning.png" alt="Двоє фахівців переглядають плани проєкту">
      </figure>

      <article class="tile stat stat-projects">
        <strong>10k</strong>
        <span>Completed Projects</span>
      </article>

      <figure class="tile engineer-photo">
        <img src="images zad1/site-engineer.png" alt="Інженерка на будівельному майданчику">
      </figure>

      <figure class="tile builder-photo">
        <img src="images zad1/site-builder.png" alt="Будівельник на майданчику">
      </figure>

      <article class="tile stat stat-years">
        <strong>40+</strong>
        <span>Years Established</span>
      </article>

      <figure class="tile consultant-photo">
        <img src="images zad1/project-consultant.png" alt="Консультант за столом із кресленнями та каскою">
      </figure>
    </section>

    <footer>Images from Freepik</footer>
  </main>
</body>
</html>
